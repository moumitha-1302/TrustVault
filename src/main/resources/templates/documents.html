<!DOCTYPE html>
<<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault | Documents</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 22px 8%;
        }

        header h1 {
            margin: 0;
        }

        main {
            max-width: 700px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px #00000012;
        }

        h2 {
            color: #2563eb;
        }

        input[type="file"] {
            display: block;
            margin: 24px 0;
            width: 100%;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 7px;
            cursor: pointer;
        }

        .message {
            padding: 12px;
            background: #dcfce7;
            color: #166534;
            border-radius: 7px;
            margin: 15px 0;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <header>
        <h1>🔐 TrustVault</h1>
        <p>Your document management space</p>
    </header>

    <main>
        <h2>Upload Documents</h2>
        <p>Select a document from your computer to upload.</p>

        <div class="message" th:if="${success}"
             th:text="${success}"></div>

        <div class="message error" th:if="${error}"
             th:text="${error}"></div>


<form action="/documents/upload"
      method="post"
      enctype="multipart/form-data">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <input type="file" name="file" required>

    <button type="submit">Upload Document</button>
</form>

<hr>

<h2>Your Uploaded Documents</h2>

<p th:if="${documents.isEmpty()}">
    No documents uploaded yet.
</p>



<ul th:if="${!documents.isEmpty()}">
    <li th:each="doc : ${documents}" style="margin: 12px 0;">
        <span th:text="${doc}"></span>
        &nbsp;|&nbsp;
        <a th:href="@{/documents/download/{filename}(filename=${doc})}">
            Download
        </a>
        &nbsp;|&nbsp;
        <form th:action="@{/documents/delete/{filename}(filename=${doc})}"
              method="post"
              style="display: inline;"
              onsubmit="return confirm('Are you sure you want to delete this document?');">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit"
                    style="background: #dc2626; padding: 7px 12px;">
                Delete
            </button>
        </form>
    </li>
</ul>




        <p><a href="/">← Back to Dashboard</a></p>
    </main>
</body>
</html>
